name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter happy exec vitest run --project unit
      - run: pnpm --filter happy-app typecheck
      - run: pnpm --filter happy-server build
      - run: pnpm --filter happy-server test
      - run: pnpm --filter happy-app exec vitest run sources/auth/privateCredentials.test.ts sources/utils/xdcodeModels.test.ts sources/utils/newSessionAgentSelection.test.ts sources/components/modelModeOptions.test.ts sources/sync/agentDefaults.test.ts sources/sync/messageMeta.test.ts sources/sync/machineChoices.spec.ts sources/hooks/useStartSessionFromDraft.test.ts
